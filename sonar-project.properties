# ============================================================
# SonarQube / SonarCloud - BFlow Financial Engine
# ============================================================

# Project identification
sonar.projectKey=DiazzzDev_BFlow-Backend-Open-Source
sonar.organization=diazzzdev

# Source code
sonar.sources=src/main/java
sonar.tests=src/test/java

# Java version
sonar.java.source=21

# Encoding
sonar.sourceEncoding=UTF-8

# Code coverage
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# Duplication exclusions

# Resources contain intentionally repetitive localization,
# email templates, validation messages, etc.
sonar.cpd.exclusions=src/main/resources/**

# Coverage exclusions

# Configuration / infrastructure classes that are not
# meaningful targets for unit-test coverage.
sonar.coverage.exclusions=\
**/config/**,\
**/configuration/**,\
**/*Config.java,\
**/*Configuration.java,\
**/*Application.java

# Test exclusions
sonar.test.exclusions=**/test/**

# General exclusions
sonar.exclusions=\
target/**,\
**/generated/**,\
**/generated-sources/**

# SCM
sonar.scm.provider=git