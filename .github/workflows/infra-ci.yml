name: BFlow Infra CI

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "infra/**"
      - "ecs/**"
      - ".github/workflows/deploy.yml"
      - ".github/workflows/infra-ci.yml"

permissions:
  contents: read

jobs:
  validate-infra:
    name: Validate Terraform and deployment templates
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform format
        run: terraform -chdir=infra/terraform fmt -check -recursive

      - name: Terraform validation
        run: |
          terraform -chdir=infra/terraform init -backend=false
          terraform -chdir=infra/terraform validate

      - name: Validate ECS templates are valid JSON
        run: |
          jq empty ecs/task-definition.template.json
          jq empty ecs/network-config.template.json

      - name: Guard rail — pre-revenue defaults remain inexpensive
        run: |
          grep -q 'default     = "supabase"' infra/terraform/variables.tf
          grep -q 'default     = false' infra/terraform/variables.tf
