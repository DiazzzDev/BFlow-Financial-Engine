name: BFlow Studio Security

on:
  workflow_call:

permissions:
  contents: read

jobs:

  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  semgrep:
    name: Semgrep static analysis
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run Semgrep Community Edition
        run: semgrep scan --config auto --error

  trivy:
    name: Docker image scan
    runs-on: ubuntu-latest
    needs: gitleaks

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build Docker image
        run: |
          docker build \
            -t bflow-backend:security-scan \
            .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@38b337fff0a2f984d5be173c99e3f633438167ec # pinned master commit
        with:
          image-ref: bflow-backend:security-scan
          format: table
          severity: CRITICAL,HIGH
          ignorefile: .trivyignore
          exit-code: 1
