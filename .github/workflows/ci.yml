name: BFlow Studio CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  verify:
    name: Unit, integration, style and coverage
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify tests and coverage baseline
        env:
          TEST_DB_HOST: localhost
          AWS_REGION: us-east-1
          AWS_SES_FROM_EMAIL: noreply@bflow-studio.com
          S3_BUCKET: bflow-ci-placeholder
          RECEIPT_OCR_REQUESTS_QUEUE_URL: https://sqs.us-east-1.amazonaws.com/000000000000/ci-placeholder
          RECEIPT_OCR_RESULTS_QUEUE_URL: https://sqs.us-east-1.amazonaws.com/000000000000/ci-placeholder
          RECEIPT_OCR_RESULTS_TOPIC_ARN: arn:aws:sns:us-east-1:000000000000:ci-placeholder
          TEXTRACT_SNS_ROLE_ARN: arn:aws:iam::000000000000:role/ci-placeholder
          COGNITO_ISSUER_URI: https://cognito-idp.us-east-1.amazonaws.com/us-east-1_ciplaceholder
          COGNITO_USER_POOL_ID: us-east-1_ciplaceholder
          LOGO_URL: https://res.cloudinary.com/dmv1q774l/image/upload/v1778910438/Bflow-logo-v1_yq5uyb.png
          WOMPI_CLIENT_ID: ci-placeholder
          WOMPI_CLIENT_SECRET: ci-placeholder
        run: ./mvnw -B verify

      - name: Check style
        run: ./mvnw -B checkstyle:check

      - name: Publish coverage artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: error

  mcp-apps-qa:
    name: MCP Apps browser harness
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright/java:v1.64.0-noble
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bflow
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DB_HOST: postgres
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ci-placeholder
      AWS_SECRET_ACCESS_KEY: ci-placeholder
      AWS_SES_FROM_EMAIL: noreply@bflow-studio.com
      S3_BUCKET: bflow-ci-placeholder
      RECEIPT_OCR_REQUESTS_QUEUE_URL: https://sqs.us-east-1.amazonaws.com/000000000000/ci-placeholder
      RECEIPT_OCR_RESULTS_QUEUE_URL: https://sqs.us-east-1.amazonaws.com/000000000000/ci-placeholder
      RECEIPT_OCR_RESULTS_TOPIC_ARN: arn:aws:sns:us-east-1:000000000000:ci-placeholder
      TEXTRACT_SNS_ROLE_ARN: arn:aws:iam::000000000000:role/ci-placeholder
      COGNITO_ISSUER_URI: https://cognito-idp.us-east-1.amazonaws.com/us-east-1_ciplaceholder
      COGNITO_USER_POOL_ID: us-east-1_ciplaceholder
      LOGO_URL: https://res.cloudinary.com/dmv1q774l/image/upload/v1778910438/Bflow-logo-v1_yq5uyb.png
      WOMPI_CLIENT_ID: ci-placeholder
      WOMPI_CLIENT_SECRET: ci-placeholder
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run browser-level legal document journey
        run: ./mvnw -B -P mcp-apps-qa test-compile failsafe:integration-test failsafe:verify

  security:
    name: Secret and container scanning
    uses: ./.github/workflows/security.yml
