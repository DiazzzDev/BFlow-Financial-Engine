services:
  app:
    container_name: bflow-backend
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: postgres
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_DRIVER: org.postgresql.Driver
      DB_SSL_MODE: disable
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-dummy-client-id}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-dummy-client-secret}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_SES_FROM_EMAIL: ${AWS_SES_FROM_EMAIL:-test@example.com}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-dummy}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-dummy}
      # Wompi (PAYWALL)
      WOMPI_CLIENT_ID: ${WOMPI_CLIENT_ID:-dummy-wompi-client-id}
      WOMPI_CLIENT_SECRET: ${WOMPI_CLIENT_SECRET:-dummy-wompi-client-secret}
      WOMPI_APP_ID: ${WOMPI_APP_ID:-dummy-wompi-app-id}
      WOMPI_API_SECRET: ${WOMPI_API_SECRET:-dummy-wompi-api-secret}
      # Branding / Auth
      LOGO_URL: ${LOGO_URL:-https://via.placeholder.com/150}
      COGNITO_ISSUER_URI: ${COGNITO_ISSUER_URI:-https://cognito-idp.us-east-1.amazonaws.com/dummy-user-pool-id}
      # AWS S3 / OCR de recibos (SQS + SNS + Textract)
      S3_BUCKET: ${S3_BUCKET:-dummy-bflow-bucket}
      RECEIPT_OCR_REQUESTS_QUEUE_URL: ${RECEIPT_OCR_REQUESTS_QUEUE_URL:-https://sqs.us-east-1.amazonaws.com/000000000000/dummy-ocr-requests}
      RECEIPT_OCR_RESULTS_QUEUE_URL: ${RECEIPT_OCR_RESULTS_QUEUE_URL:-https://sqs.us-east-1.amazonaws.com/000000000000/dummy-ocr-results}
      RECEIPT_OCR_RESULTS_TOPIC_ARN: ${RECEIPT_OCR_RESULTS_TOPIC_ARN:-arn:aws:sns:us-east-1:000000000000:dummy-ocr-results-topic}
      TEXTRACT_SNS_ROLE_ARN: ${TEXTRACT_SNS_ROLE_ARN:-arn:aws:iam::000000000000:role/dummy-textract-sns-role}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - bflow-network
    restart: unless-stopped

  db:
    container_name: bflow-postgres
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    networks:
      - bflow-network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  bflow-network:
    driver: bridge

volumes:
  postgres-data:
