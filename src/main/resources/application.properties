spring.application.name=BFlow
server.port=${PORT:8080}
server.address=0.0.0.0
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=25s
server.servlet.context-path=/
app.base-url=${BASE_URL:http://localhost:8080}

# PostgreSQL Database Connection
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bflow}?sslmode=${DB_SSL_MODE:disable}&prepareThreshold=0
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}

spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=180000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
#spring.main.lazy-initialization=true

# Hibernate/JPA Configuration
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.format-sql=false

spring.jpa.hibernate.ddl-auto=validate

# Batch INSERTs/UPDATEs into fewer round-trips instead of one
# statement per row (matters for RecurringTransactionExecutor and
# any bulk operation).
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.fail-on-missing-locations=true
spring.flyway.validate-migration-naming=true
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}

app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# AWS integration properties
aws.region=${AWS_REGION}
aws.ses.from=${AWS_SES_FROM_EMAIL}

# Security / auth error logging
app.security.auth-error-log-throttle-seconds=${AUTH_ERROR_LOG_THROTTLE_SECONDS:60}

# AWS S3 storage
aws.s3.bucket=${S3_BUCKET}
aws.s3.max-file-size-bytes=${S3_MAX_FILE_SIZE_BYTES:10485760}

# File upload rules
app.storage.allowed-content-types=${STORAGE_ALLOWED_CONTENT_TYPES:image/jpeg,image/png,image/webp,application/pdf}
app.storage.presign-duration-minutes=${STORAGE_PRESIGN_DURATION_MINUTES:15}
app.storage.download-presign-duration-minutes=${STORAGE_DOWNLOAD_PRESIGN_DURATION_MINUTES:15}
app.storage.avatar-max-file-size-bytes=${AVATAR_MAX_FILE_SIZE_BYTES:2097152}

# Multipart uploads (first multipart endpoint in the app — every
# other upload goes through presigned S3 URLs, but a small avatar
# doesn't justify that two-step flow)
spring.servlet.multipart.max-file-size=${AVATAR_MAX_FILE_SIZE_MB:2MB}
spring.servlet.multipart.max-request-size=${AVATAR_MAX_REQUEST_SIZE_MB:3MB}

# Receipt OCR pipeline (S3 -> SQS -> Textract StartExpenseAnalysis -> SNS -> SQS)
aws.sqs.receipt-ocr-requests-queue-url=${RECEIPT_OCR_REQUESTS_QUEUE_URL}
aws.sqs.receipt-ocr-results-queue-url=${RECEIPT_OCR_RESULTS_QUEUE_URL}
aws.sns.receipt-ocr-results-topic-arn=${RECEIPT_OCR_RESULTS_TOPIC_ARN}
aws.textract.sns-role-arn=${TEXTRACT_SNS_ROLE_ARN}
app.ocr.request-poll-wait-seconds=${OCR_REQUEST_POLL_WAIT_SECONDS:20}
app.ocr.result-poll-wait-seconds=${OCR_RESULT_POLL_WAIT_SECONDS:20}
app.ocr.poll-max-messages=${OCR_POLL_MAX_MESSAGES:5}
app.ocr.poll-error-backoff-seconds=${OCR_POLL_ERROR_BACKOFF_SECONDS:5}

management.info.env.enabled=true
info.app.name=BFlow
info.app.version=0.1.0
info.app.description=Finance management API
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.info.git.enabled=true

spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false
support.email=support@bflow-studio.com
app.email.logo-url=${LOGO_URL}

# Email templates live under templates/email/{en|es}/, not the
# default classpath:/templates/ root — EmailTemplateService resolves
# them as "{lang}/{baseName}" (e.g. "es/forgot-password"), so the
# prefix must include the "email/" segment or Thymeleaf looks in the
# wrong directory and every send*Email call fails.
spring.thymeleaf.prefix=classpath:/templates/email/

security.password-reset.expiration-minutes=15
security.email-verification.expiration-hours=24

# Cognito Resource Server
spring.security.oauth2.resourceserver.jwt.issuer-uri=${COGNITO_ISSUER_URI}

#spring.data.jpa.repositories.bootstrap-mode=lazy
spring.data.jpa.repositories.bootstrap-mode=deferred

#app.idempotency.ttl=30s For testing only

wompi.token-url=https://id.wompi.sv/connect/token
wompi.base-url=https://api.wompi.sv
wompi.client-id=${WOMPI_CLIENT_ID}
wompi.client-secret=${WOMPI_CLIENT_SECRET}
wompi.app-id=${WOMPI_APP_ID}
wompi.api-secret=${WOMPI_API_SECRET}

# =========================================================
# LOGGING
# =========================================================

logging.level.root=WARN
logging.level.bflow=INFO

# Framework noise
logging.level.org.springframework=WARN
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN

# Persistence
logging.level.org.hibernate=WARN
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF

# Database pool
logging.level.com.zaxxer.hikari=WARN

# Infrastructure
logging.level.software.amazon.awssdk=WARN

# Flyway
logging.level.org.flywaydb=WARN

logging.pattern.dateformat=yyyy-MM-dd HH:mm:ss.SSS
